<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Appnix CRM Pro</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/logo-favicon.webp" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        background: white;
        padding: 2.5rem;
        border-radius: 1rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 1.75rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: #4f46e5;
        color: white;
        text-decoration: none;
        padding: 0.65rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        transition: background 0.15s;
      }
      .btn-primary:hover {
        background: #4338ca;
      }
      .btn-secondary {
        background: white;
        color: #334155;
        text-decoration: none;
        padding: 0.65rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        border: 1px solid #cbd5e1;
        transition: background 0.15s;
      }
      .btn-secondary:hover {
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist, was removed, or is temporarily unavailable.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Back to Homepage</a>
        <a href="/login" class="btn-secondary">Sign In</a>
      </div>
    </div>
  </body>
</html>
